<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>연결 확인 | 한국골드마켓</title>
    <style>
      body { margin:0; padding:20px; font-family:system-ui,-apple-system,Segoe UI,'Noto Sans KR',sans-serif; background:#f5f1e8; color:#10243a; display:grid; place-items:center; min-height:100vh; box-sizing:border-box; }
      .card { position:relative; background:#fffdfa; padding:42px 34px; border:1px solid #d9d1c1; border-top:3px solid #af8434; box-shadow:0 18px 48px rgba(13,32,52,.12); max-width:460px; text-align:left; }
      .seal { display:grid; place-items:center; width:48px; height:48px; margin-bottom:24px; border:1px solid #af8434; border-radius:50%; color:#7d5a1e; font-family:Batang,Georgia,serif; }
      h1 { margin:0 0 12px; color:#0d2034; font-family:Batang,Georgia,serif; font-size:26px; }
      p { margin:0 0 8px; color:#5f625f; line-height:1.7; }
      small { color:#8b8a83; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="seal" aria-hidden="true">금</div>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>한국골드마켓의 최신 계산 기준과 교환내역을 불러오려면 네트워크 연결이 필요합니다.</p>
      <small>연결 후 화면을 새로고침해 주세요.</small>
    </div>
  </body>
</html>
