name: Quality and security rules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix tests/rules ci
      - run: npm run lint
      - run: npm run build
        env:
          SITEMAP_OFFLINE: "1"
      - run: npm run test:app-check
      - run: npm run test:ui-safety
      - run: npm run test:seo-guides
      - run: npm --prefix functions run lint
      - run: npm --prefix functions run build
      - name: Operations recovery unit regression
        run: node --test functions/scripts/test-operations-patch.mjs
      - name: Operations recovery emulator regression
        run: npx --yes firebase-tools@15.30.2 --project demo-goldmarket emulators:exec --only firestore,auth "node functions/scripts/test-operations-patch-emulator.mjs"
        env:
          GCLOUD_PROJECT: demo-goldmarket
          GOOGLE_CLOUD_PROJECT: demo-goldmarket
      - run: node functions/scripts/test-booking-policy.mjs
      - run: npm --prefix functions run test:account-deletion
      - run: npm --prefix functions run test:nickname-security
      - run: npm --prefix functions run test:release-safety
      - run: npx firebase-tools emulators:exec --only firestore,storage "npm --prefix tests/rules test"
