name: Quality and security rules

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm --prefix tests/rules install
      - run: npm run lint
      - run: npm run build
        env:
          SITEMAP_OFFLINE: "1"
      - run: npm --prefix functions run lint
      - run: npm --prefix functions run build
      - run: node functions/scripts/test-booking-policy.mjs
      - run: npm --prefix functions run test:account-deletion
      - run: npx firebase-tools emulators:exec --only firestore "npm --prefix tests/rules test"
